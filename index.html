<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuenta regresiva</title>
    <link rel="stylesheet" href="estilos.css">
    </head>
<body>
    <div id="main-container">
        <div id="contend-container">
            <div id="title-container">
                <h1 id="title">Ingrese el limite de segundos</h1>
                <form id="form">
                    <label for="input" id="label">Ingrese un numero entre 1 y 60</label>
                    <input id="input" name="input" type="text">
                    <button id="submit">Iniciar</button>
                </form>
            </div>
            <div id="number-container">
                <p class="number"></p>
                <button id="back">Reiniciar</button>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
